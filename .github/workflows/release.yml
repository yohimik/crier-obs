name: release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      releasing: ${{ steps.plan.outputs.releasing }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: yohimik/dispat@v1
        with: {version: "1.10.0"}
      # --require-release exits 3 when nothing is releasable. That is the answer, not a failure: the run
      # ends green with the later jobs skipped. Every other nonzero code is a real failure.
      - name: What would be released
        id: plan
        run: |
          rc=0
          dispat status --require-release --log-format json || rc=$?
          case "$rc" in
            0) echo "releasing=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "releasing=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Nothing to release since the last tag"
              ;;
            *) exit "$rc" ;;
          esac
  tests:
    needs: plan
    if: needs.plan.outputs.releasing == 'true'
    uses: ./.github/workflows/tests.yml
  release:
    needs: [plan, tests]
    if: needs.plan.outputs.releasing == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.dispat.outputs.released }}
      version: ${{ steps.dispat.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: sudo apt-get update && sudo apt-get install -y luajit libluajit-5.1-dev
      - uses: yohimik/dispat@v1
        with: {version: "1.10.0"}
      - name: Publish through dispat
        id: dispat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dispat --log-format json
  install:
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: step-security/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: leafo/gh-actions-lua@v11
        with: {luaVersion: luajit-2.1}
      - name: Build Windows smoke executable
        if: runner.os == 'Windows'
        shell: bash
        run: go build -o plugin/spec/fakes/crier_win/crier.exe plugin/spec/fakes/crier_win/main.go
      - name: Verify release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        # The smoke reads only spec/ from the checkout; without src/ the asset cannot borrow a module from it.
        run: |
          gh release download "v$VERSION" --pattern crier-obs.lua --dir plugin/dist
          cd plugin
          rm -rf src
          luajit -bl dist/crier-obs.lua >/dev/null
          luajit tools/smoke.lua dist/crier-obs.lua --version "$VERSION" --pin "$(cat crier.version)"
