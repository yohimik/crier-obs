name: crier registry sync
on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: crier-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit luarocks libluajit-5.1-dev liblua5.1-0-dev shellcheck
          luarocks --lua-version=5.1 --local install busted 2.3.0
          luarocks --lua-version=5.1 --local install luacov 0.17.0
          luarocks --lua-version=5.1 --local install luacheck 1.2.0
      - name: Propose a pin bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$HOME/.luarocks/bin:$PATH"
          eval "$(luarocks --lua-version=5.1 path)"
          sh plugin/tools/crier_sync.sh
