name: crier registry sync
on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
# The pull request is opened with GITHUB_TOKEN, which needs the repository setting "Allow GitHub Actions
# to create and approve pull requests". Such a pull request starts no workflow, so crier_sync.sh runs the
# gates itself and then dispatches tests.yml on the branch (a dispatch is the one event GITHUB_TOKEN may
# start), whose checks report on the pull request's head commit. No extra secret is needed.
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: crier-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit luarocks libluajit-5.1-dev liblua5.1-0-dev shellcheck
          luarocks --lua-version=5.1 --local install busted 2.3.0
          luarocks --lua-version=5.1 --local install luacov 0.17.0
          luarocks --lua-version=5.1 --local install luacheck 1.2.0
      - name: Propose a pin bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$HOME/.luarocks/bin:$PATH"
          eval "$(luarocks --lua-version=5.1 path)"
          sh plugin/tools/crier_sync.sh
